---
name: "Auto Tag and Release"
description: "Automatically create Git tags and GitHub releases for new versions"
branding:
  icon: "package"
  color: "blue"
inputs:
  version:
    description: "The version for the release"
    required: true
  previous-version:
    description: "The previous version for the release"
    required: false
    default: ""
  dry-run:
    description: "If true, skip creating tags and releases (useful for testing)"
    required: false
    default: "false"
  ref:
    description: "The ref to tag and release"
    required: false
    default: ${{ github.sha }}
  summary:
    description: "If true, output a summary to the job summary"
    required: false
    default: "true"
outputs:
  version:
    description: "The version for the release"
    value: ${{ inputs.version }}
  previous-version:
    description: "The previous version for the release"
    value: ${{ inputs.previous-version }}
  sha:
    description: "The SHA of the commit the tag points to"
    value: ${{ steps.standardize-ref.outputs.sha }}
  released:
    description: "Whether a new release was created"
    value: ${{ steps.set-output.outputs.released }}
runs:
  using: "composite"
  steps:
    - name: Validate version
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        if [[ -z "$VERSION" ]]; then
          echo "::error::Version input is required and cannot be empty"
          exit 1
        fi

    - name: Check if version changed
      id: version-changed
      shell: bash
      env:
        PREVIOUS_VERSION: ${{ inputs.previous-version }}
        CURRENT_VERSION: ${{ inputs.version }}
      run: |
        if [[ -z "$PREVIOUS_VERSION" ]]; then
          # No previous version provided, assume it's new
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Previous version not provided, assuming new version"
        elif [[ "$PREVIOUS_VERSION" == "$CURRENT_VERSION" ]]; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "Version unchanged: $CURRENT_VERSION"
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Version changed: $PREVIOUS_VERSION -> $CURRENT_VERSION"
        fi
    - name: Check if tag exists
      id: check-tag
      uses: actions/github-script@v8
      env:
        VERSION: ${{ inputs.version }}
      with:
        script: |
          const version = process.env['VERSION'];
          try {
            await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `tags/${version}`
            });
            core.info(`Tag ${version} already exists`);
            core.setOutput('exists', 'true');
          } catch (error) {
            if (error.status === 404) {
              core.info(`Tag ${version} does not exist`);
              core.setOutput('exists', 'false');
            } else {
              throw error;
            }
          }

    - name: Check if release exists
      id: check-release
      uses: actions/github-script@v8
      env:
        VERSION: ${{ inputs.version }}
      with:
        script: |
          const version = process.env['VERSION'];
          try {
            await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: version
            });
            core.info(`Release ${version} already exists`);
            core.setOutput('exists', 'true');
          } catch (error) {
            if (error.status === 404) {
              core.info(`Release ${version} does not exist`);
              core.setOutput('exists', 'false');
            } else {
              throw error;
            }
          }

    - name: Standardize ref
      id: standardize-ref
      env:
        REF: ${{ inputs.ref }}
      uses: actions/github-script@v8
      with:
        script: |
          const shaRegex = /^[0-9a-f]{4,40}$/i;
          const ref = process.env['REF'];
          let normalizedRef = ref.replace(/^refs\//, '');

          if (!normalizedRef.includes('/')) {
            normalizedRef = `heads/${normalizedRef}`
          }

          try {
            const { data } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: normalizedRef
            });

            core.setOutput('sha', data.object.sha);
            return
          } catch (error) {
            if (error.status === 404) {
              core.info(`Ref not found: ${normalizedRef}`);
            } else {
              core.error(`Error getting ref: ${normalizedRef}`);
              throw error;
            }
          }

          if (shaRegex.test(ref)) {
            core.setOutput('sha', ref.toLowerCase());
            return
          }

          core.error(`Invalid ref: ${ref}`);
          process.exit(1);

    - name: Create tag
      id: create-tag
      if: >-
        steps.version-changed.outputs.changed == 'true' &&
        steps.check-tag.outputs.exists == 'false' &&
        inputs.dry-run != 'true'
      uses: actions/github-script@v8
      env:
        VERSION: ${{ inputs.version }}
        SHA: ${{ steps.standardize-ref.outputs.sha }}
      with:
        script: |
          const version = process.env['VERSION'];
          const sha = process.env['SHA'];
          core.info(`Creating tag: ${version}`);
          await github.rest.git.createRef({
            owner: context.repo.owner,
            repo: context.repo.repo,
            ref: `refs/tags/${version}`,
            sha: sha
          });

    - name: Create release
      id: create-release
      if: >-
        steps.version-changed.outputs.changed == 'true' &&
        steps.check-release.outputs.exists == 'false' &&
        inputs.dry-run != 'true'
      uses: actions/github-script@v8
      env:
        VERSION: ${{ inputs.version }}
      with:
        script: |
          const version = process.env['VERSION'];
          core.info(`Creating release: ${version}`);
          await github.rest.repos.createRelease({
            owner: context.repo.owner,
            repo: context.repo.repo,
            tag_name: version,
            name: version,
            generate_release_notes: true
          });

    - name: Set output
      id: set-output
      shell: bash
      env:
        VERSION_CHANGED: ${{ steps.version-changed.outputs.changed }}
        RELEASE_EXISTS: ${{ steps.check-release.outputs.exists }}
      run: |
        # Released is true only when version changed AND release didn't exist
        if [[ "$VERSION_CHANGED" == "true" && "$RELEASE_EXISTS" == "false" ]]; then
          echo "released=true" >> "$GITHUB_OUTPUT"
        else
          echo "released=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Summary
      if: inputs.summary == 'true'
      uses: actions/github-script@v8
      env:
        VERSION: ${{ inputs.version }}
        PREVIOUS_VERSION: ${{ inputs.previous-version }}
        SHA: ${{ steps.standardize-ref.outputs.sha }}
        VERSION_CHANGED: ${{ steps.version-changed.outputs.changed }}
        DRY_RUN: ${{ inputs.dry-run }}
        TAG_EXISTS: ${{ steps.check-tag.outputs.exists }}
        RELEASE_EXISTS: ${{ steps.check-release.outputs.exists }}
        RELEASED: ${{ steps.set-output.outputs.released }}
      with:
        script: |
          const version = process.env.VERSION;
          const previousVersion = process.env.PREVIOUS_VERSION || 'N/A';
          const sha = process.env.SHA || 'N/A';
          const versionChanged = process.env.VERSION_CHANGED === 'true';
          const dryRun = process.env.DRY_RUN === 'true';
          const tagExisted = process.env.TAG_EXISTS === 'true';
          const releaseExisted = process.env.RELEASE_EXISTS === 'true';
          const released = process.env.RELEASED === 'true';

          const icon = released ? '🚀' : '⏭️';
          const title = dryRun ? `${icon} Auto Tag and Release (Dry Run)` : `${icon} Auto Tag and Release`;

          let tagStatus, releaseStatus;
          if (!versionChanged) {
            tagStatus = '⏭️ Skipped (version unchanged)';
            releaseStatus = '⏭️ Skipped (version unchanged)';
          } else if (dryRun) {
            tagStatus = tagExisted ? '⏭️ Already exists' : '🆕 Would create';
            releaseStatus = releaseExisted ? '⏭️ Already exists' : '🆕 Would create';
          } else {
            tagStatus = tagExisted ? '⏭️ Already exists' : '✅ Created';
            releaseStatus = releaseExisted ? '⏭️ Already exists' : '✅ Created';
          }

          await core.summary
            .addHeading(title, 2)
            .addTable([
              [{data: 'Property', header: true}, {data: 'Value', header: true}],
              ['Version', `<code>${version}</code>`],
              ['Previous Version', `<code>${previousVersion}</code>`],
              ['SHA', `<code>${sha}</code>`],
              ['Version Changed', versionChanged ? 'Yes' : 'No'],
              ['Dry Run', dryRun ? 'Yes' : 'No'],
              ['Tag', tagStatus],
              ['Release', releaseStatus],
              ['Released', released ? 'Yes' : 'No']
            ])
            .write();
